name: Link check

on:
  schedule:
    - cron: "41 4 * * 3"   # Wednesdays 04:41 UTC
  workflow_dispatch:
  pull_request:
    paths: ["data/**", "README.md", "docs/**"]

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --cache --max-cache-age 3d
            --max-concurrency 8 --retry-wait-time 5 --max-retries 3
            --accept 200..=299,403,429
            --exclude-path LICENSE
            README.md docs/*.md
          fail: ${{ github.event_name == 'pull_request' }}
          output: lychee/out.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Open issue on broken links
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links report
          content-filepath: lychee/out.md
          labels: broken-links
